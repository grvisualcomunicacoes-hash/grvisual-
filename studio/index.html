<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#060A15">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../favicon-32.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<script src="config.js"></script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>GR Visual Studio IA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: app de agência, navegação inferior no celular e trilho lateral no computador; tema escuro único (azul-marinho/preto, ciano, roxo/magenta) */
:root{
  --bg:#060A15; --panel:#0C1326; --panel2:#111A33; --line:#1D2A4A; --fg:#E7EDF8; --muted:#8C99B6;
  --cyan:#25E3F1; --violet:#8D63FF; --magenta:#E246A6; --cyan-soft:rgba(37,227,241,.12); --violet-soft:rgba(141,99,255,.16);
  --good:#38D69B; --warn:#F4B942; --bad:#F2566E;
  --f-display:"Unbounded","Figtree",system-ui,sans-serif; --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:14px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--cyan)}
.app{display:flex;min-height:100%}
.rail{display:none}
.main{flex:1;min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(var(--bg) 70%,transparent);display:flex;align-items:center;gap:12px;padding-block:14px 12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:10px;background:conic-gradient(from 210deg,var(--cyan),var(--violet),var(--magenta),var(--cyan));display:grid;place-items:center;flex:none}
.logo span{width:26px;height:26px;border-radius:7px;background:var(--bg);display:grid;place-items:center;font-family:var(--f-display);font-size:10px;font-weight:700;color:var(--cyan)}
.brand h1{font-family:var(--f-display);font-size:15px;font-weight:600;margin:0;letter-spacing:.01em;white-space:nowrap}
.brand h1 em{font-style:normal;background:linear-gradient(90deg,var(--violet),var(--magenta));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.top .sp{flex:1}
.sync{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--good);box-shadow:0 0 8px var(--good)}
.dot.off{background:var(--bad)}

nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(8,13,28,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nb{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--muted);font-size:11px;font-weight:600;border-radius:10px;cursor:pointer}
.nb svg{width:22px;height:22px}
.nb.on{color:var(--cyan)}
.nb.on svg{filter:drop-shadow(0 0 6px rgba(37,227,241,.6))}
@media (min-width:900px){
  nav.bottom{display:none}
  .rail{display:flex;flex-direction:column;gap:4px;width:220px;flex:none;position:sticky;top:0;height:100vh;padding:20px 12px;border-right:1px solid var(--line);background:var(--panel)}
  .rail .nb{flex-direction:row;justify-content:flex-start;gap:12px;font-size:14px;padding:10px 12px}
  .rail .nb.on{background:var(--cyan-soft)}
  .rail .brand{padding:0 8px 18px}
  .main{padding-block:0 40px}
  header.top .brand{display:none}
}

h2.pg{font-family:var(--f-display);font-size:20px;font-weight:600;margin:6px 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 16px;font-size:14px}
h3.sec{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px;font-weight:700;display:flex;align-items:center;gap:8px}
h3.sec .c{font-family:var(--f-mono);color:var(--cyan);letter-spacing:0}

.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.kpi b{display:block;font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi span{color:var(--muted);font-size:12px}
.kpi.hl{background:linear-gradient(140deg,rgba(37,227,241,.14),rgba(141,99,255,.12));border-color:rgba(37,227,241,.35)}
.kpi.hl b{color:var(--cyan)}

.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;min-width:0;cursor:pointer;text-align:left;width:100%}
.row:hover{border-color:#2B3B63}
.row .tx{flex:1;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .m{color:var(--muted);font-size:13px;margin-top:2px;overflow-wrap:anywhere}
.row .r{text-align:right;font-family:var(--f-mono);font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.stripe{width:4px;align-self:stretch;border-radius:3px;background:var(--line);flex:none}
.stripe.bad{background:var(--bad)} .stripe.warn{background:var(--warn)} .stripe.good{background:var(--good)} .stripe.cy{background:var(--cyan)} .stripe.vi{background:var(--violet)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--panel2);color:var(--muted);white-space:nowrap;letter-spacing:.02em}
.pill.good{background:rgba(56,214,155,.14);color:var(--good)} .pill.warn{background:rgba(244,185,66,.14);color:var(--warn)} .pill.bad{background:rgba(242,86,110,.14);color:var(--bad)} .pill.cy{background:var(--cyan-soft);color:var(--cyan)} .pill.vi{background:var(--violet-soft);color:#B69BFF}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1 1 160px;min-width:0}
input.f,select.f,textarea.f{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;min-width:0}
textarea.f{min-height:84px;resize:vertical}
input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan-soft)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#30416B}
.btn.pri{background:var(--cyan);border-color:var(--cyan);color:#04121A}
.btn.ai{background:linear-gradient(100deg,var(--violet),var(--magenta));border:0;color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.nb:focus-visible,.row:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--cyan-soft);border-color:rgba(37,227,241,.5);color:var(--cyan)}

.empty{border:1px dashed var(--line);border-radius:12px;padding:20px;color:var(--muted);text-align:center;font-size:14px}
.note{background:var(--violet-soft);border:1px solid rgba(141,99,255,.35);border-radius:12px;padding:12px 14px;font-size:13.5px}
.note.warn{background:rgba(244,185,66,.1);border-color:rgba(244,185,66,.35)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}

/* kanban */
.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
.col{flex:0 0 260px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px;scroll-snap-align:start;min-height:120px}
.col h4{margin:2px 4px 10px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.col h4 i{font-style:normal;font-family:var(--f-mono);color:var(--cyan)}
.col.drop{border-color:var(--cyan)}
.kc{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;cursor:grab}
.kc .t{font-weight:600;font-size:14px}
.kc select{margin-top:8px;font-size:12px;padding:6px 8px}

/* calendário */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font-size:11px;color:var(--muted);text-align:center;padding:4px 0;font-weight:700}
.cd{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-height:52px;padding:4px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.cd.out{opacity:.35}
.cd.today{border-color:var(--cyan)}
.cd.sel{background:var(--cyan-soft);border-color:var(--cyan)}
.cd .n{font-family:var(--f-mono);font-size:12px}
.cd .ds{display:flex;flex-wrap:wrap;gap:2px}
.cd .ds i{width:6px;height:6px;border-radius:50%;background:var(--violet)}
.cd .ds i.ok{background:var(--good)} .cd .ds i.ap{background:var(--warn)}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.msg{max-width:92%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}
.msg.u{align-self:flex-end;background:var(--cyan-soft);border:1px solid rgba(37,227,241,.3)}
.msg.a{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
.msg.a::before{content:"TIA";display:block;font-family:var(--f-display);font-size:10px;letter-spacing:.1em;background:linear-gradient(90deg,var(--violet),var(--magenta));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:4px}
.composer{position:sticky;bottom:76px;display:flex;gap:8px;background:var(--bg);padding-block:8px}
@media (min-width:900px){.composer{bottom:0}}
.out{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(2,5,12,.7);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:18px;max-height:88vh}}
.sheet h3{font-family:var(--f-display);font-size:16px;margin:0 0 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.fg{display:grid;gap:12px}
.fg label{display:grid;gap:5px;font-size:12.5px;color:var(--muted);font-weight:600}
.fg .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:16px;position:sticky;bottom:-20px;background:var(--panel);padding-block:10px}
.dl{display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr);gap:6px 12px;font-size:14px}
.dl dt{color:var(--muted);font-size:12.5px}
.dl dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.hist{border-left:2px solid var(--line);padding-left:12px;display:grid;gap:8px;font-size:13.5px}
.hist time{font-family:var(--f-mono);font-size:11px;color:var(--cyan)}
.grid2{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:60}
.spark{display:flex;align-items:flex-end;gap:6px;height:90px;padding-top:6px}
.spark div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;min-width:0}
.spark .b{width:100%;border-radius:5px 5px 2px 2px;background:linear-gradient(var(--cyan),rgba(37,227,241,.25))}
.spark .b.d{background:linear-gradient(var(--magenta),rgba(226,70,166,.25))}
.spark small{font-size:10px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.view{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

</head>
<body>
<div class="app">
  <aside class="rail" id="rail"></aside>
  <div class="main">
    <header class="top">
      <div class="brand"><div class="logo"><span>GR</span></div><div><h1>GR Visual <em>Studio IA</em></h1><small>Sua ideia, nossa criação</small></div></div>
      <div class="sp"></div>
      <div class="sync"><i class="dot" id="dot"></i><span id="synctx">Conectando…</span></div>
    </header>
    <main id="view" class="view"></main>
  </div>
</div>
<nav class="bottom" id="bnav"></nav>
<div id="sheetRoot"></div>

<script>
(() => {
"use strict";
// ---------- constantes ----------
const ETAPAS = ["Lead recebido","Primeiro contato","Qualificação","Reunião agendada","Proposta enviada","Negociação","Contrato enviado","Contrato assinado","Pagamento inicial confirmado","Briefing pendente","Briefing recebido","Estratégia em elaboração","Planejamento de conteúdo","Produção de artes e vídeos","Revisão interna","Enviado para aprovação","Ajustes solicitados","Aprovado pelo cliente","Agendamento","Publicação","Relatório de resultados","Renovação","Concluído ou arquivado"];
const STATUS = ["Ativo","Em negociação","Lead","A confirmar","Pausado","Encerrado"];
const STATUS_CL = {"Ativo":"good","Em negociação":"cy","Lead":"vi","A confirmar":"warn","Pausado":"","Encerrado":""};
const PRIOS = ["URGENTE","IMPORTANTE","PODE ESPERAR","NÃO PRECISA SER FEITO"];
const PRIO_CL = {"URGENTE":"bad","IMPORTANTE":"warn","PODE ESPERAR":"cy","NÃO PRECISA SER FEITO":""};
const PLATS = ["Instagram","Facebook","TikTok","WhatsApp","Google","Marketplace","Outro"];
const FORMATOS = ["Feed","Story","Reels","Carrossel","Vídeo","Anúncio"];
const PROD = ["Ideia","Em produção","Pronto"];
const APROV = ["Não enviado","Aguardando aprovação","Ajustes solicitados","Aprovado"];
const PUB = ["Não agendado","Agendado","Publicado","Falha na publicação","Cancelado"];
const FIN_CAT = ["Gestão de redes","Tráfego (gestão)","Serviço avulso","Verba de anúncios","Gráfica / produção","Ferramentas","Despesa operacional","Comissão / parceria","Outro"];
const PAGTO = ["Pendente","Parcial","Pago","Cancelado"];

const F = {
  clientes:[
    {k:"nome",l:"Cliente ou empresa",req:1},{k:"responsavel",l:"Responsável pelo contato"},
    {k:"status",l:"Situação",t:"sel",o:STATUS},{k:"etapa",l:"Etapa do projeto",t:"sel",o:ETAPAS},
    {k:"whatsapp",l:"WhatsApp / telefone"},{k:"email",l:"E-mail"},{k:"cidade",l:"Endereço e cidade"},
    {k:"redes",l:"Redes sociais e links",t:"area"},{k:"segmento",l:"Segmento"},
    {k:"descricao",l:"Descrição do negócio",t:"area"},{k:"publico",l:"Público-alvo",t:"area"},
    {k:"produtos",l:"Produtos e serviços do cliente",t:"area"},{k:"diferenciais",l:"Diferenciais",t:"area"},
    {k:"objetivos",l:"Objetivos de marketing",t:"area"},{k:"tomVoz",l:"Tom de voz, cores e identidade",t:"area"},
    {k:"servicos",l:"Serviços contratados",t:"area"},{k:"valor",l:"Valor contratado (R$)",t:"num"},
    {k:"verba",l:"Verba de anúncios (paga pelo cliente, R$)",t:"num"},
    {k:"inicio",l:"Início",t:"date"},{k:"vencimento",l:"Vencimento / fim",t:"date"},
    {k:"pagamento",l:"Forma e situação do pagamento"},{k:"contrato",l:"Contrato e briefing (situação/links)",t:"area"},
    {k:"canva",l:"Links do Canva, vídeos e artes",t:"area"},{k:"notas",l:"Observações",t:"area"}
  ],
  conteudos:[
    {k:"clienteId",l:"Cliente",t:"cli",req:1},{k:"data",l:"Data",t:"date"},{k:"hora",l:"Horário",t:"time"},
    {k:"plataforma",l:"Plataforma",t:"sel",o:PLATS},{k:"formato",l:"Formato",t:"sel",o:FORMATOS},
    {k:"tema",l:"Tema",req:1},{k:"pilar",l:"Pilar estratégico"},{k:"objetivo",l:"Objetivo"},
    {k:"textoArte",l:"Texto da arte",t:"area"},{k:"legenda",l:"Legenda",t:"area"},{k:"cta",l:"CTA"},
    {k:"hashtags",l:"Hashtags"},{k:"roteiro",l:"Roteiro",t:"area"},{k:"gravacao",l:"Instruções de gravação",t:"area"},
    {k:"canva",l:"Link do Canva / arquivo"},{k:"prod",l:"Produção",t:"sel",o:PROD},{k:"aprov",l:"Aprovação",t:"sel",o:APROV},
    {k:"pub",l:"Publicação",t:"sel",o:PUB},{k:"metricas",l:"Métricas (origem e data)",t:"area"}
  ],
  financeiro:[
    {k:"tipo",l:"Tipo",t:"sel",o:["Receita","Despesa"]},{k:"descricao",l:"Descrição",req:1},
    {k:"clienteId",l:"Cliente (opcional)",t:"cli"},{k:"categoria",l:"Categoria",t:"sel",o:FIN_CAT},
    {k:"valor",l:"Valor (R$)",t:"num",req:1},{k:"vencimento",l:"Vencimento",t:"date"},
    {k:"situacao",l:"Situação",t:"sel",o:PAGTO},{k:"valorPago",l:"Valor já pago (R$)",t:"num"},
    {k:"dataPagamento",l:"Data do pagamento",t:"date"},{k:"obs",l:"Observações / comprovante",t:"area"}
  ],
  tarefas:[
    {k:"titulo",l:"Tarefa",req:1},{k:"clienteId",l:"Cliente (opcional)",t:"cli"},
    {k:"prioridade",l:"Prioridade",t:"sel",o:PRIOS},{k:"prazo",l:"Prazo",t:"date"},{k:"obs",l:"Detalhes",t:"area"}
  ],
  pacotes:[
    {k:"nome",l:"Nome do pacote",req:1},{k:"preco",l:"Preço (R$)",t:"num"},{k:"duracao",l:"Duração"},
    {k:"descricao",l:"Descrição",t:"area"},{k:"entregaveis",l:"Entregáveis",t:"area"},
    {k:"publicacoes",l:"Quantidade de publicações"},{k:"plataformas",l:"Plataformas"},
    {k:"condicoes",l:"Condições de pagamento"},{k:"extras",l:"Custos extras / adicionais",t:"area"},
    {k:"disponivel",l:"Disponível",t:"sel",o:["Sim","Não"]}
  ]
};
F.documentos=[
  {k:"clienteId",l:"Cliente",t:"cli",req:1},{k:"titulo",l:"Título do documento",req:1},
  {k:"tipo",l:"Tipo",t:"sel",o:["Contrato","Proposta","Briefing","Autorização de imagem","Termo de aprovação","Relatório","Outro"]},
  {k:"origem",l:"Origem (PDF original, transcrição, link)"},{k:"pdf",l:"PDF original / link do arquivo"},
  {k:"inicio",l:"Início",t:"date"},{k:"fim",l:"Término",t:"date"},{k:"valor",l:"Valor total (R$)",t:"num"},

const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

function SupabaseDB(client,uid){
  const cache={}, subs={};
  const snap=c=>({docs:Object.entries(cache[c]||{}).map(([id,v])=>({id,exists:true,data:()=>v}))});
  const emit=c=>(subs[c]||[]).forEach(fn=>fn(snap(c)));
  const falha=e=>({code:"unavailable",message:e&&e.message||"erro"});
  async function carregar(c){
    const {data,error}=await client.from("registros").select("id,dados").eq("colecao",c).limit(5000);
    if(error) throw falha(error);
    cache[c]={}; data.forEach(r=>{cache[c][r.id]=r.dados}); emit(c);
  }
  async function gravar(c,i,v){
    const {error}=await client.from("registros").upsert({user_id:uid,colecao:c,id:i,dados:v,atualizado_em:new Date().toISOString()});
    if(error) throw falha(error);
    (cache[c]=cache[c]||{})[i]=v; emit(c);
  }
  const ref=(c,i)=>({id:i,
    set:v=>gravar(c,i,clone(v)),
    update:async v=>{ const cur=(cache[c]||{})[i]; if(!cur) throw {code:"invalid_argument"}; await gravar(c,i,{...cur,...clone(v)}); },
    delete:async()=>{ const {error}=await client.from("registros").delete().eq("colecao",c).eq("id",i); if(error) throw falha(error); if(cache[c]) delete cache[c][i]; emit(c); }});
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) Object.keys(subs).forEach(c=>carregar(c).catch(()=>{})); });
  return {collection:c=>({doc:i=>ref(c,i||nid()), add:async v=>{ const r=ref(c,nid()); await r.set(v); return r; },
    onSnapshot:(fn,err)=>{ (subs[c]=subs[c]||[]).push(fn); carregar(c).catch(e=>err&&err(e)); return ()=>{}; }})};
}
function LocalDB(){
  const KEY="grvisual-studio-v1"; let data={};
  try{ data=JSON.parse(localStorage.getItem(KEY)||"{}")||{}; }catch(e){ data={}; }
  const subs={};
  const persist=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(data)); }catch(e){ toast("Não foi possível salvar neste aparelho"); throw {code:"unavailable"}; } };
  const snap=c=>({docs:Object.entries(data[c]||{}).map(([id,v])=>({id,exists:true,data:()=>v}))});
  const emit=c=>(subs[c]||[]).forEach(fn=>fn(snap(c)));
  const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  const clone=v=>JSON.parse(JSON.stringify(v));
  const ref=(c,i)=>({id:i,
    set:async v=>{ (data[c]=data[c]||{})[i]=clone(v); persist(); emit(c); },
    update:async v=>{ data[c]=data[c]||{}; if(!data[c][i]) throw {code:"invalid_argument"}; Object.assign(data[c][i],clone(v)); persist(); emit(c); },
    delete:async()=>{ if(data[c]) delete data[c][i]; persist(); emit(c); }});
  addEventListener("storage",e=>{ if(e.key===KEY){ try{ data=JSON.parse(e.newValue||"{}")||{}; Object.keys(subs).forEach(emit); }catch(_){} } });
  return {collection:c=>({doc:i=>ref(c,i||nid()), add:async v=>{ const r=ref(c,nid()); await r.set(v); return r; },
    onSnapshot:fn=>{ (subs[c]=subs[c]||[]).push(fn); setTimeout(()=>fn(snap(c)),0); return ()=>{}; }})};
}

      try{
        sb=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true}});
        const {data}=await sb.auth.getSession(); sessao=data.session;
        sb.auth.onAuthStateChange((ev,s)=>{ if(ev==="SIGNED_OUT"||(ev==="SIGNED_IN"&&!sessao)) location.reload(); sessao=s; });
      }catch(e){ sb=null; }

      else if(sb){ modo="login"; setSync(false,"Entre para sincronizar"); view="login"; renderNav(); render(); return; }
    }
    if(!db){ db=LocalDB(); modo="local"; setSync(true,cfg?"Banco indisponível · salvo no aparelho":"Salvo neste aparelho"); }

  renderNav();

    db.collection(c).onSnapshot(snap=>{
      S[c]=snap.docs.map(d=>({id:d.id,...d.data()}));
      loaded.add(c);

}

async function salvar(col,id,dados){

  try{
    dados.atualizadoEm=agora();
    if(id){ await db.collection(col).doc(id).update(dados); }
    else { dados.criadoEm=agora(); await db.collection(col).add(dados); }
    return true;
  }catch(e){
    toast(e.code==="quota_exceeded"?"Limite de armazenamento atingido":"Não salvou ("+(e.code||"erro")+"). Tente de novo.");

const ehVerba = l => l.categoria==="Verba de anúncios";
function pagoValor(l){ if(l.situacao==="Pago") return Number(l.valor)||0; if(l.situacao==="Parcial") return Number(l.valorPago)||0; return 0; }
function emAberto(l){ if(l.situacao==="Pago"||l.situacao==="Cancelado") return 0; return (Number(l.valor)||0)-(l.situacao==="Parcial"?(Number(l.valorPago)||0):0); }
function finMes(ym, clienteId){
  const L=S.financeiro.filter(l=>l.situacao!=="Cancelado" && (!clienteId||l.clienteId===clienteId));
  const noMes = l => (l.vencimento||"").startsWith(ym);
  const pagoNoMes = l => (l.dataPagamento||l.vencimento||"").startsWith(ym);
  const rec=L.filter(l=>l.tipo!=="Despesa"&&!ehVerba(l)), des=L.filter(l=>l.tipo==="Despesa"&&!ehVerba(l));
  const previsto=rec.filter(noMes).reduce((s,l)=>s+(Number(l.valor)||0),0);
  const recebido=rec.filter(l=>pagoValor(l)>0&&pagoNoMes(l)).reduce((s,l)=>s+pagoValor(l),0);
  const aReceber=rec.filter(noMes).reduce((s,l)=>s+emAberto(l),0);
  const despesas=des.filter(noMes).reduce((s,l)=>s+(Number(l.valor)||0),0);
  const despPagas=des.filter(l=>pagoValor(l)>0&&pagoNoMes(l)).reduce((s,l)=>s+pagoValor(l),0);
  const verba=L.filter(l=>ehVerba(l)&&noMes(l)).reduce((s,l)=>s+(Number(l.valor)||0),0);
  return {previsto,recebido,aReceber,despesas,despPagas,verba,lucro:recebido-despPagas,lucroPrev:previsto-despesas};
}
function alertas(){

  S.financeiro.filter(l=>l.tipo!=="Despesa"&&emAberto(l)>0&&l.vencimento&&l.vencimento<t).forEach(l=>A.push({n:3,cl:"bad",t:"Pagamento vencido: "+brl(emAberto(l)),m:(cliNome(l.clienteId)||l.descricao)+" · venceu "+dBR(l.vencimento),go:["financeiro",l]}));
  S.financeiro.filter(l=>emAberto(l)>0&&l.vencimento&&l.vencimento>=t&&l.vencimento<=em7).forEach(l=>A.push({n:2,cl:"warn",t:(l.tipo==="Despesa"?"Conta a pagar: ":"A receber: ")+brl(emAberto(l)),m:(cliNome(l.clienteId)||l.descricao)+" · vence "+dBR(l.vencimento),go:["financeiro",l]}));
  S.clientes.filter(c=>c.status==="Ativo"&&c.vencimento&&c.vencimento>=t&&c.vencimento<=addDias(t,10)).forEach(c=>A.push({n:2,cl:"warn",t:"Contrato perto do fim: "+c.nome,m:"Termina "+dBR(c.vencimento)+" · oportunidade de renovação",go:["clientes",c]}));
  S.clientes.filter(c=>c.status==="Ativo"&&c.vencimento&&c.vencimento<t).forEach(c=>A.push({n:3,cl:"bad",t:"Contrato vencido e ainda ativo: "+c.nome,m:"Venceu "+dBR(c.vencimento)+" · renovar ou encerrar",go:["clientes",c]}));
  S.clientes.filter(c=>c.status==="A confirmar").forEach(c=>A.push({n:1,cl:"vi",t:"A confirmar: "+c.nome,m:(c.notas||"Revise o cadastro").split("\n")[0].slice(0,110),go:["clientes",c]}));
  S.clientes.filter(c=>c.status==="Ativo"&&(!c.valor||!c.vencimento)).forEach(c=>A.push({n:1,cl:"vi",t:"Cadastro incompleto: "+c.nome,m:"Falta "+[!c.valor&&"valor",!c.vencimento&&"vencimento"].filter(Boolean).join(" e "),go:["clientes",c]}));
  S.documentos.filter(d=>d.tipo==="Contrato"&&(!/comprovad/i.test(d.assinatura||"")||!/comprovad/i.test(d.pagamento||""))&&(!d.fim||d.fim>=t)).forEach(d=>A.push({n:1,cl:"vi",t:"Contrato pendente: "+(cliNome(d.clienteId)||d.titulo),m:"Assinatura: "+(d.assinatura||"a confirmar")+" · Pagamento: "+(d.pagamento||"a confirmar"),go:["documentos",d]}));
  return A.sort((a,b)=>b.n-a.n);
}

function semBanco(){ return (modo==="local"||modo==="nuvem") && S.clientes.length===0 && loaded.has("clientes") ? `<div class="note" style="margin-bottom:12px">Primeiro acesso neste aparelho. Para trazer seus clientes, vá em <b>Mais › Importar backup</b> e escolha o arquivo de backup da GR Visual.</div>` : ""; }

function vInicio(){
  const ym=ui.dashMes, cid=ui.dashCli||"";
  const f=finMes(ym,cid);
  const C=S.clientes.filter(c=>!cid||c.id===cid);
  const ativos=C.filter(c=>c.status==="Ativo").length, neg=C.filter(c=>c.status==="Em negociação"||c.status==="Lead").length;
  const emAnd=C.filter(c=>c.status==="Ativo"&&c.etapa&&c.etapa!=="Concluído ou arquivado").length;
  const Ct=S.conteudos.filter(x=>!cid||x.clienteId===cid);
  const aguard=Ct.filter(x=>x.aprov==="Aguardando aprovação").length;
  const agend=Ct.filter(x=>x.pub==="Agendado").length;
  const publ=Ct.filter(x=>x.pub==="Publicado"&&(x.data||"").startsWith(ym)).length;
  const t=hoje();
  const atras=S.tarefas.filter(x=>!x.feito&&x.prazo&&x.prazo<t&&(!cid||x.clienteId===cid)).length;
  const A=alertas().filter(a=>!cid||a.go[1].id===cid||a.go[1].clienteId===cid);
  const prox=S.tarefas.filter(x=>!x.feito&&(!cid||x.clienteId===cid)).sort((a,b)=>PRIOS.indexOf(a.prioridade)-PRIOS.indexOf(b.prioridade)||(a.prazo||"9").localeCompare(b.prazo||"9")).slice(0,5);
  const proxCont=Ct.filter(x=>x.data&&x.data>=t&&x.pub!=="Publicado"&&x.pub!=="Cancelado").sort((a,b)=>(a.data+(a.hora||"")).localeCompare(b.data+(b.hora||""))).slice(0,4);
  const meses=[-3,-2,-1,0].map(n=>mesShift(ym,n)); const fm=meses.map(m=>finMes(m,cid)); const mx=Math.max(1,...fm.map(x=>Math.max(x.recebido,x.despesas)));
  const saud = (()=>{const h=new Date().getHours();return h<12?"Bom dia":h<18?"Boa tarde":"Boa noite"})();
  return `${semBanco()}
  <h2 class="pg">${saud}, Pamella</h2>
  <p class="sub">${new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"})}</p>
  <div class="toolbar">
    <select class="f grow" id="dashMes" aria-label="Período">${[-2,-1,0,1,2].map(n=>mesShift(mesAtual(),n)).map(m=>`<option value="${m}" ${m===ym?"selected":""}>${mesNome(m)}</option>`).join("")}</select>
    <select class="f grow" id="dashCli" aria-label="Cliente"><option value="">Todos os clientes</option>${S.clientes.filter(c=>c.status!=="Encerrado").sort((a,b)=>a.nome.localeCompare(b.nome)).map(c=>`<option value="${c.id}" ${c.id===cid?"selected":""}>${esc(c.nome)}</option>`).join("")}</select>
  </div>
  <div class="kpis">
    <div class="kpi hl"><span>Recebido em ${mesNome(ym)}</span><b>${brl(f.recebido)}</b></div>
    <div class="kpi"><span>Receita prevista</span><b>${brl(f.previsto)}</b></div>
    <div class="kpi"><span>A receber</span><b>${brl(f.aReceber)}</b></div>
    <div class="kpi"><span>Lucro estimado</span><b style="color:${f.lucro<0?"var(--bad)":"var(--good)"}">${brl(f.lucro)}</b></div>
    <div class="kpi"><span>Clientes ativos</span><b>${ativos}</b></div>
    <div class="kpi"><span>Em negociação / leads</span><b>${neg}</b></div>
    <div class="kpi"><span>Aguardando aprovação</span><b>${aguard}</b></div>
    <div class="kpi"><span>Tarefas atrasadas</span><b style="color:${atras?"var(--bad)":"inherit"}">${atras}</b></div>
  </div>
  <div class="pills" style="margin-top:10px"><span class="pill">Projetos em andamento: ${emAnd}</span><span class="pill">Agendados: ${agend}</span><span class="pill">Publicados no mês: ${publ}</span><span class="pill">Despesas do mês: ${brl(f.despesas)}</span>${f.verba?`<span class="pill">Verba de anúncios (repasse): ${brl(f.verba)}</span>`:""}</div>

  <h3 class="sec">Atenção <span class="c">${A.length}</span></h3>
  ${carregando("clientes")?vazio("Carregando…"):A.length?`<div class="list">${A.slice(0,8).map((a,i)=>`<button class="row" data-alerta="${i}"><i class="stripe ${a.cl}"></i><div class="tx"><div class="t">${esc(a.t)}</div><div class="m">${esc(a.m)}</div></div></button>`).join("")}</div>`:vazio("Nada pendente por aqui.")}

  <h3 class="sec">Prioridades</h3>
  ${prox.length?`<div class="list">${prox.map(x=>linhaTarefa(x)).join("")}</div>`:vazio("Nenhuma tarefa aberta.",`<button class="btn sm" data-novo="tarefas">+ Nova tarefa</button>`)}

  <h3 class="sec">Próximos conteúdos</h3>
  ${proxCont.length?`<div class="list">${proxCont.map(linhaConteudo).join("")}</div>`:vazio("Nenhum conteúdo agendado a partir de hoje.",`<button class="btn sm" data-novo="conteudos">+ Novo conteúdo</button>`)}

  <h3 class="sec">Caixa — últimos 4 meses</h3>
  <div class="card"><div class="spark">${meses.map((m,i)=>`<div title="${mesNome(m)}: recebido ${brl(fm[i].recebido)}, despesas ${brl(fm[i].despesas)}"><div style="display:flex;gap:3px;align-items:flex-end;width:100%;height:100%"><div class="b" style="height:${Math.max(2,fm[i].recebido/mx*100)}%"></div><div class="b d" style="height:${Math.max(2,fm[i].despesas/mx*100)}%"></div></div><small>${mesNome(m).slice(0,3)}</small></div>`).join("")}</div>
  <div class="pills"><span class="pill cy">■ Recebido</span><span class="pill" style="color:var(--magenta)">■ Despesas</span></div></div>

  <h3 class="sec">Atalhos</h3>
  <div class="grid2">
    <button class="btn" data-novo="clientes">+ Cliente ou lead</button>
    <button class="btn" data-novo="conteudos">+ Conteúdo</button>
    <button class="btn" data-novo="financeiro">+ Lançamento</button>
    <button class="btn ai" data-go="tia">Perguntar à TIA</button>
  </div>`;
}
function linhaTarefa(x){
  const t=hoje(); const at=x.prazo&&x.prazo<t&&!x.feito;
  return `<div class="row" style="cursor:default"><input type="checkbox" data-feito="${x.id}" ${x.feito?"checked":""} aria-label="Concluir" style="width:20px;height:20px;margin-top:2px;accent-color:var(--cyan)">
  <div class="tx" data-edit="tarefas:${x.id}" style="cursor:pointer"><div class="t" style="${x.feito?"text-decoration:line-through;color:var(--muted)":""}">${esc(x.titulo)}</div>
  <div class="pills">${x.prioridade?`<span class="pill ${PRIO_CL[x.prioridade]}">${esc(x.prioridade)}</span>`:""}${x.clienteId?`<span class="pill">${esc(cliNome(x.clienteId))}</span>`:""}${x.prazo?`<span class="pill ${at?"bad":""}">${at?"Atrasada · ":""}${dBR(x.prazo)}</span>`:""}</div></div></div>`;
}
function linhaConteudo(x){
  const ap=x.aprov==="Aprovado"?"good":x.aprov==="Aguardando aprovação"?"warn":x.aprov==="Ajustes solicitados"?"bad":"";
  return `<button class="row" data-edit="conteudos:${x.id}"><i class="stripe ${x.pub==="Publicado"?"good":ap||"vi"}"></i><div class="tx"><div class="t">${esc(x.tema||"Sem tema")}</div>
  <div class="m">${esc(cliNome(x.clienteId))} · ${esc(x.plataforma||"")} ${esc(x.formato||"")}</div>
  <div class="pills">${x.prod?`<span class="pill">${esc(x.prod)}</span>`:""}${x.aprov?`<span class="pill ${ap}">${esc(x.aprov)}</span>`:""}${x.pub?`<span class="pill ${x.pub==="Publicado"?"good":x.pub==="Agendado"?"cy":x.pub==="Falha na publicação"?"bad":""}">${esc(x.pub)}</span>`:""}</div></div>
  <div class="r">${dCurto(x.data)}<div class="m">${esc(x.hora||"")}</div></div></button>`;
}

function vClientes(){
  const filtros=["Ativos","Negociação","Leads","A confirmar","Encerrados","Todos"];
  const q=ui.busca.toLowerCase();
  const map={"Ativos":c=>c.status==="Ativo","Negociação":c=>c.status==="Em negociação","Leads":c=>c.status==="Lead","A confirmar":c=>c.status==="A confirmar","Encerrados":c=>c.status==="Encerrado"||c.status==="Pausado","Todos":()=>true};
  const L=S.clientes.filter(map[ui.cliFiltro]).filter(c=>!q||[c.nome,c.responsavel,c.segmento,c.redes,c.cidade].join(" ").toLowerCase().includes(q)).sort((a,b)=>a.nome.localeCompare(b.nome));
  const cnt=k=>S.clientes.filter(map[k]).length;
  return `${semBanco()}<h2 class="pg">Clientes e CRM</h2><p class="sub">${S.clientes.length} cadastros · toque para abrir a ficha</p>
  <div class="toolbar"><input class="f grow" id="busca" placeholder="Buscar nome, segmento, rede…" value="${esc(ui.busca)}"><button class="btn pri" data-novo="clientes">+ Novo</button></div>
  <div class="chips">${filtros.map(k=>`<button class="chip ${ui.cliFiltro===k?"on":""}" data-clif="${k}">${k} ${cnt(k)}</button>`).join("")}</div>
  ${carregando("clientes")?vazio("Carregando clientes…"):L.length?`<div class="list">${L.map(c=>`<button class="row" data-ficha="${c.id}"><i class="stripe ${STATUS_CL[c.status]||""}"></i><div class="tx"><div class="t">${esc(c.nome)}</div>
  <div class="m">${esc([c.responsavel,c.segmento].filter(Boolean).join(" · "))}</div><div class="pills"><span class="pill ${STATUS_CL[c.status]||""}">${esc(c.status||"Sem situação")}</span>${c.etapa?`<span class="pill">${esc(c.etapa)}</span>`:""}</div></div>
  <div class="r">${c.valor?brl(c.valor):""}${c.vencimento?`<div class="m">até ${dCurto(c.vencimento)}</div>`:""}</div></button>`).join("")}</div>`:vazio(q?"Nenhum cliente encontrado para essa busca.":"Nenhum cliente nesta lista.",`<button class="btn sm" data-novo="clientes">+ Cadastrar cliente</button>`)}
  <div class="toolbar" style="margin-top:16px"><button class="btn sm" id="expCli">Exportar clientes (CSV)</button></div>`;
}
function fichaCliente(id){
  const c=cli(id); if(!c) return;
  const conts=S.conteudos.filter(x=>x.clienteId===id).sort((a,b)=>(b.data||"").localeCompare(a.data||"")).slice(0,6);
  const fin=S.financeiro.filter(l=>l.clienteId===id).sort((a,b)=>(a.vencimento||"").localeCompare(b.vencimento||""));
  const tar=S.tarefas.filter(x=>x.clienteId===id&&!x.feito);
  const docs=S.documentos.filter(d=>d.clienteId===id).sort((a,b)=>(b.inicio||"").localeCompare(a.inicio||""));
  const recebido=fin.filter(l=>l.tipo!=="Despesa"&&!ehVerba(l)).reduce((s,l)=>s+pagoValor(l),0);
  const aberto=fin.filter(l=>l.tipo!=="Despesa"&&!ehVerba(l)).reduce((s,l)=>s+emAberto(l),0);
  const campos=F.clientes.filter(f=>!["nome","status","etapa"].includes(f.k)&&c[f.k]!==undefined&&c[f.k]!==null&&c[f.k]!=="");
  sheet(`<h3><span>${esc(c.nome)}</span><button class="btn sm" data-close>Fechar</button></h3>
  <div class="pills" style="margin:-6px 0 12px"><span class="pill ${STATUS_CL[c.status]||""}">${esc(c.status||"Sem situação")}</span>${c.etapa?`<span class="pill cy">${esc(c.etapa)}</span>`:""}${c.origem?`<span class="pill">Origem: ${esc(c.origem)}</span>`:""}</div>
  <div class="toolbar"><button class="btn sm pri" id="edCli">Editar ficha</button><button class="btn sm" id="nTar">+ Tarefa</button><button class="btn sm" id="nCont">+ Conteúdo</button><button class="btn sm" id="nFin">+ Cobrança</button><button class="btn sm" id="nDoc">+ Documento</button><button class="btn sm ai" id="tiaCli">Resumo da TIA</button></div>
  <div class="kpis" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="kpi"><span>Recebido (total)</span><b>${brl(recebido)}</b></div><div class="kpi"><span>Em aberto</span><b>${brl(aberto)}</b></div></div>
  <div id="tiaCliOut"></div>
  <h3 class="sec">Ficha</h3>
  ${campos.length?`<dl class="dl">${campos.map(f=>`<dt>${esc(f.l)}</dt><dd>${f.t==="num"?brl(c[f.k]):f.t==="date"?dBR(c[f.k]):esc(c[f.k])}</dd>`).join("")}</dl>`:vazio("Ficha sem detalhes ainda.")}
  <h3 class="sec">Contratos e documentos <span class="c">${docs.length}</span></h3>${docs.length?`<div class="list">${docs.map(linhaDoc).join("")}</div>`:`<p class="sub">Nenhum documento.</p>`}
  <h3 class="sec">Tarefas abertas <span class="c">${tar.length}</span></h3>${tar.length?`<div class="list">${tar.map(linhaTarefa).join("")}</div>`:`<p class="sub">Nenhuma.</p>`}
  <h3 class="sec">Financeiro <span class="c">${fin.length}</span></h3>${fin.length?`<div class="list">${fin.map(linhaFin).join("")}</div>`:`<p class="sub">Nenhum lançamento.</p>`}
  <h3 class="sec">Conteúdos recentes <span class="c">${conts.length}</span></h3>${conts.length?`<div class="list">${conts.map(linhaConteudo).join("")}</div>`:`<p class="sub">Nenhum conteúdo.</p>`}
  <h3 class="sec">Histórico e decisões</h3>
  <div class="toolbar"><input class="f grow" id="histTx" placeholder="Registrar conversa, decisão, aprovação…"><button class="btn sm" id="histAdd">Registrar</button></div>
  <div class="hist">${[...(c.historico||[])].reverse().map(h=>`<div><time>${new Date(h.d).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"})}</time><div>${esc(h.t)}</div></div>`).join("")||`<span class="sub">Sem registros.</span>`}</div>`);
  $("#edCli").onclick=()=>abrirForm("clientes",c);
  $("#nTar").onclick=()=>abrirForm("tarefas",null,{clienteId:id,prioridade:"IMPORTANTE"});
  $("#nCont").onclick=()=>abrirForm("conteudos",null,{clienteId:id,prod:"Ideia",aprov:"Não enviado",pub:"Não agendado"});
  $("#nDoc").onclick=()=>abrirForm("documentos",null,{clienteId:id,tipo:"Contrato",assinatura:"A confirmar",pagamento:"A confirmar"});
  document.querySelectorAll("#sheetRoot [data-doc]").forEach(el=>el.onclick=()=>verDoc(el.dataset.doc));
  $("#nFin").onclick=()=>abrirForm("financeiro",null,{clienteId:id,tipo:"Receita",situacao:"Pendente",categoria:"Gestão de redes"});
  $("#histAdd").onclick=async()=>{const t=$("#histTx").value.trim(); if(!t) return; const h=[...(c.historico||[]),{d:agora(),t}].slice(-80); if(await salvar("clientes",id,{historico:h})){ c.historico=h; fichaCliente(id); toast("Registrado"); }};
  $("#tiaCli").onclick=()=>resumoCliente(c);
  bindSheetRows();
}
async function resumoCliente(c){
  const out=$("#tiaCliOut");
  if(!sample){ out.innerHTML=`<div class="note warn" style="margin-top:10px">A IA não está disponível nesta visualização.</div>`; return; }
  out.innerHTML=`<div class="card" style="margin-top:10px"><div class="tag" style="color:#B69BFF">Sugestão da IA · gerando…</div><div class="out" id="rcTx">Pensando…</div></div>`;
  const dados=JSON.stringify(contextoCliente(c));
  try{
    await sample(`Você é a TIA, assistente da agência GR Visual Comunicações (dona: Pamella). Em português do Brasil, faça um resumo curto da situação deste cliente usando SOMENTE os dados abaixo. Estruture em: "Confirmado" (fatos registrados), "Pendente / a confirmar" e "Sugestões da TIA" (próximos 3 passos práticos, realistas para quem trabalha sozinha). Não invente valores, datas ou pagamentos. Texto simples, sem markdown pesado.\n\nHoje: ${hoje()}\nDADOS:\n${dados}`,{onText:({text})=>{$("#rcTx").textContent=text},cache:false});
    $("#tiaCliOut .tag").textContent="Sugestão da IA";
  }catch(e){ $("#rcTx").textContent=e.text||erroIA(e); }
}
function contextoCliente(c){
  const {historico,...rest}=c;
  return {cliente:rest,historico:(historico||[]).slice(-15),
    financeiro:S.financeiro.filter(l=>l.clienteId===c.id).map(l=>({tipo:l.tipo,descricao:l.descricao,categoria:l.categoria,valor:l.valor,vencimento:l.vencimento,situacao:l.situacao,valorPago:l.valorPago,dataPagamento:l.dataPagamento})),
    tarefas:S.tarefas.filter(t=>t.clienteId===c.id).map(t=>({titulo:t.titulo,prioridade:t.prioridade,prazo:t.prazo,feito:!!t.feito})),
    documentos:S.documentos.filter(d=>d.clienteId===c.id).map(d=>({titulo:d.titulo,inicio:d.inicio,fim:d.fim,valor:d.valor,parcelas:d.parcelas,assinatura:d.assinatura,pagamento:d.pagamento,pendencias:d.pendencias,origem:d.origem})),
    conteudos:S.conteudos.filter(x=>x.clienteId===c.id).slice(-15).map(x=>({tema:x.tema,data:x.data,plataforma:x.plataforma,formato:x.formato,prod:x.prod,aprov:x.aprov,pub:x.pub}))};
}
function erroIA(e){ return ({not_granted:"Você não autorizou a IA neste app. Reabra e permita para usar.",rate_limited:"Limite de uso atingido. Tente de novo daqui a pouco.",session_expired:"Sua sessão expirou. Entre de novo no Claude.",refused:"A IA não respondeu a esse pedido. Reformule.",sampling_disabled:"A IA não está disponível nesta conta."})[e.code]||"Não foi possível gerar agora. Tente de novo."; }

function linhaDoc(d){
  const ok=/comprovad/i.test(d.assinatura||""), pg=/comprovad/i.test(d.pagamento||"");
  return `<button class="row" data-doc="${d.id}"><i class="stripe ${ok&&pg?"good":"warn"}"></i><div class="tx"><div class="t">${esc(d.titulo)}</div>
  <div class="m">${esc([d.tipo,d.inicio&&d.fim?dBR(d.inicio)+" a "+dBR(d.fim):"",d.valor?brl(d.valor):""].filter(Boolean).join(" · "))}</div>
  <div class="pills"><span class="pill ${ok?"good":"warn"}">Assinatura: ${esc(d.assinatura||"A confirmar")}</span><span class="pill ${pg?"good":"warn"}">Pagamento: ${esc(d.pagamento||"A confirmar")}</span>${/transcri/i.test(d.origem||"")?`<span class="pill vi">Transcrição</span>`:""}</div></div></button>`;
}
function verDoc(id){
  const d=S.documentos.find(x=>x.id===id); if(!d) return;
  const campos=[["Cliente",cliNome(d.clienteId)],["Tipo",d.tipo],["Origem",d.origem],["PDF original",d.pdf],["Vigência",d.inicio?dBR(d.inicio)+" a "+dBR(d.fim):""],["Valor total",d.valor?brl(d.valor):""],["Parcelas",d.parcelas],["Assinatura",d.assinatura],["Pagamento",d.pagamento],["Pendências",d.pendencias]].filter(x=>x[1]);
  sheet(`<h3><span>${esc(d.titulo)}</span><button class="btn sm" data-close>Fechar</button></h3>
  <div class="toolbar"><button class="btn sm pri" id="edDoc">Editar</button><button class="btn sm" id="voltaCli">Voltar à ficha</button></div>
  <dl class="dl">${campos.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
  ${d.texto?`<h3 class="sec">Texto</h3><div class="card out" style="font-size:14px">${esc(d.texto)}</div>`:""}
  <h3 class="sec">Histórico</h3><div class="hist">${[...(d.historico||[])].reverse().map(h=>`<div><time>${new Date(h.d).toLocaleDateString("pt-BR")}</time><div>${esc(h.t)}</div></div>`).join("")||`<span class="sub">Sem registros.</span>`}</div>`);
  $("#edDoc").onclick=()=>abrirForm("documentos",d);
  $("#voltaCli").onclick=()=>fichaCliente(d.clienteId);
}
function linhaFin(l){
  const t=hoje(), ab=emAberto(l), venc=ab>0&&l.vencimento&&l.vencimento<t;
  const cl=l.situacao==="Pago"?"good":venc?"bad":l.situacao==="Parcial"?"warn":l.situacao==="Cancelado"?"":"cy";
  return `<button class="row" data-edit="financeiro:${l.id}"><i class="stripe ${cl}"></i><div class="tx"><div class="t">${esc(l.descricao)}</div>
  <div class="m">${esc([cliNome(l.clienteId),l.categoria].filter(Boolean).join(" · "))}</div>
  <div class="pills"><span class="pill ${cl}">${venc?"Vencido":esc(l.situacao||"Pendente")}</span>${l.vencimento?`<span class="pill">vence ${dBR(l.vencimento)}</span>`:""}${l.situacao==="Parcial"?`<span class="pill">falta ${brl(ab)}</span>`:""}</div></div>
  <div class="r" style="color:${l.tipo==="Despesa"?"var(--magenta)":"inherit"}">${l.tipo==="Despesa"?"−":""}${brl(l.valor)}</div></button>`;
}
function vFinanceiro(){
  const ym=ui.finMes, f=finMes(ym);
  const abas=[["lancamentos","Lançamentos"],["receber","A receber"],["pagar","A pagar"],["clientes","Por cliente"],["servicos","Por serviço"]];
  let corpo="";

function abrirParcelas(){
  sheet(`<h3>Criar parcelas<button class="btn sm" data-close>Fechar</button></h3>

  $("#pf").onsubmit=async e=>{e.preventDefault();
    const g=k=>$("#f_"+k).value.trim(); const total=Number(g("total")), n=Math.max(1,Math.round(Number(g("n")))), iv=Number(g("intervalo"))||30;
    if(!g("clienteId")||!g("descricao")||!total||!g("primeira")){toast("Preencha os campos obrigatórios");return}
    const base=Math.floor(total/n*100)/100; let ok=true;
    for(let i=0;i<n;i++){ const v=i===n-1?Math.round((total-base*(n-1))*100)/100:base;
      ok = ok && await salvar("financeiro",null,{tipo:"Receita",clienteId:g("clienteId"),descricao:`${g("descricao")} (${i+1}/${n})`,categoria:g("categoria"),valor:v,vencimento:addDias(g("primeira"),i*iv),situacao:"Pendente"}); }

  };
}

async function testarConexao(url,key){
  const msg=$("#cfgMsg");
  if(!window.supabase){ msg.textContent="A biblioteca do banco não carregou. Verifique a internet."; return false; }
  try{
    const c=window.supabase.createClient(url,key,{auth:{persistSession:false}});
    const {error}=await c.from("registros").select("id",{count:"exact",head:true});
    if(error){ msg.innerHTML=`<span style="color:var(--bad)">${/relation|does not exist|schema cache/i.test(error.message)?"Conectou, mas a tabela não existe. Rode o arquivo supabase.sql no SQL Editor do Supabase.":"Falhou: "+esc(error.message)}</span>`; return false; }
    msg.innerHTML=`<span style="color:var(--good)">Conexão funcionando.</span>`; return true;
  }catch(e){ msg.innerHTML=`<span style="color:var(--bad)">Endereço ou chave inválidos.</span>`; return false; }
}

  const on=(id,ev,fn)=>{const el=$("#"+id); if(el) el[ev]=fn;};

// ---------- TIA ----------
const TIA_REGRAS = `Você é a TIA, assistente da agência GR Visual Comunicações. Fala com a Pamella, dona da agência, que trabalha sozinha, de casa, em Vila Velha/ES, e tem pouco tempo. Responda em português do Brasil, direto, em texto simples (listas curtas quando ajudar).
Regras:
1. Use SOMENTE os dados do sistema enviados abaixo para fatos sobre clientes, valores, datas, pagamentos e conteúdos. Nunca invente.
2. Separe claramente: "Confirmado" (está nos dados), "Pendente/a confirmar" e "Sugestão da TIA".
3. Quando faltar informação, diga o que falta.
4. Você não altera nada no sistema: se a Pamella pedir para registrar, publicar, excluir ou mudar valores, explique onde fazer no app.
5. Para muitas tarefas, organize em URGENTE → IMPORTANTE → PODE ESPERAR → NÃO PRECISA SER FEITO. Planos realistas, sem exigir disponibilidade que ela não tem.
6. Mensagens para clientes: prontas para copiar e colar no WhatsApp, naturais e profissionais.`;

    financeiro:S.financeiro.map(l=>({cliente:cliNome(l.clienteId),tipo:l.tipo,descricao:l.descricao,categoria:l.categoria,valor:l.valor,vencimento:l.vencimento,situacao:l.situacao,valorPago:l.valorPago,dataPagamento:l.dataPagamento})),
    tarefas:S.tarefas.filter(x=>!x.feito).map(x=>({titulo:x.titulo,cliente:cliNome(x.clienteId),prioridade:x.prioridade,prazo:x.prazo})),
    conteudos:S.conteudos.filter(x=>!x.data||x.data>=addDias(t,-30)).slice(0,80).map(x=>({cliente:cliNome(x.clienteId),tema:x.tema,data:x.data,hora:x.hora,plataforma:x.plataforma,formato:x.formato,producao:x.prod,aprovacao:x.aprov,publicacao:x.pub})),
    documentos:S.documentos.map(d=>({cliente:cliNome(d.clienteId),titulo:d.titulo,inicio:d.inicio,fim:d.fim,valor:d.valor,assinatura:d.assinatura,pagamento:d.pagamento,pendencias:d.pendencias})),
    pacotes:S.pacotes.map(p=>({nome:p.nome,preco:p.preco,duracao:p.duracao,entregaveis:p.entregaveis}))};
  let s=JSON.stringify(d); if(s.length>150000) s=s.slice(0,150000);
  return s;

async function enviarTia(texto){
  if(!texto||ui.tiaBusy) return;
  if(!sample){ $("#tiaLive").innerHTML=`<div class="note warn">A IA não está disponível nesta visualização. Abra o app pelo Claude.</div>`; return; }
  const atual=S.tia.find(c=>c.id===ui.tiaConv);
  const hist=[...(atual?atual.msgs||[]:[]),{r:"user",c:texto}];
  ui.tiaBusy=true; ui.tiaTemp=hist; if(!atual) ui.tiaConv=null;
  render();
  $("#tiaLive").innerHTML=`<div class="msg a" id="tiaAns">Pensando…</div>`; $("#chatEnd").scrollIntoView({block:"end"});
  const turns=[{role:"user",content:TIA_REGRAS+"\n\nDADOS DO SISTEMA (JSON):\n"+contextoGeral()},{role:"assistant",content:"Entendido. Vou usar só esses dados e separar confirmado, pendente e sugestão."},...hist.slice(-16).map(m=>({role:m.r==="user"?"user":"assistant",content:m.c}))];
  let resposta="";
  try{
    const {text}=await sample(turns,{cache:false,onText:({text})=>{const el=$("#tiaAns"); if(el) el.textContent=text;}});
    resposta=text;
  }catch(e){ resposta=(e.text?e.text+"\n\n":"")+"⚠ "+erroIA(e); }
  const novas=[...hist,{r:"assistant",c:resposta}].slice(-60);
  ui.tiaBusy=false;
  if(db){
    try{
      if(atual){ await db.collection("tia").doc(atual.id).update({msgs:novas,atualizadoEm:agora()}); }
      else { const ref=await db.collection("tia").add({titulo:texto.slice(0,60),msgs:novas,criadoEm:agora(),atualizadoEm:agora()}); ui.tiaConv=ref.id; }
      ui.tiaTemp=null;
    }catch(e){ ui.tiaTemp=novas; toast("Conversa não foi salva"); }
  } else ui.tiaTemp=novas;
  render();
}

async function importar(file){
  const msg=$("#impMsg");
  try{
    const d=JSON.parse(await file.text()); let n=0;
    for(const c of Object.keys(S)){
      if(!Array.isArray(d[c])) continue;
      for(const it of d[c]){ if(!it||!it.id) continue; const {id,...rest}=it; await db.collection(c).doc(String(id)).set(rest); n++; }
    }
    toast(n+" registros importados");
  }catch(e){ toast("Arquivo inválido: use um backup JSON deste app"); }
}
async function baixar(nome,conteudo){
  if(!downloads){
    if(window.claude){ toast("Download indisponível nesta visualização"); return; }
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([conteudo])); a.download=nome; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000); return;
  }
  try{ await downloads.save({filename:nome,data:conteudo}); }catch(e){ if(e&&e.code!=="declined"&&e.code!=="cancelled") toast("Não foi possível baixar"); }
}
function csv(linhas,cols){ const q=v=>`"${String(v??"").replace(/"/g,'""')}"`; return "﻿"+[cols.map(c=>q(c[1])).join(";"),...linhas.map(l=>cols.map(c=>q(typeof c[0]==="function"?c[0](l):l[c[0]])).join(";"))].join("\r\n"); }

  on("expFin","onclick",()=>baixar("financeiro-"+hoje()+".csv",csv(S.financeiro,[["tipo","Tipo"],["descricao","Descrição"],[l=>cliNome(l.clienteId),"Cliente"],["categoria","Categoria"],["valor","Valor"],["vencimento","Vencimento"],["situacao","Situação"],["valorPago","Valor pago"],["dataPagamento","Data pagamento"]])));
}

boot();
})();
</script>
